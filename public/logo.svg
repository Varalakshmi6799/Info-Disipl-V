<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="100%" fill="none">
  <!-- Deekshith Infra Solutions India Private Limited Official Logo -->
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: Star + Sweeping Dynamic Swoosh Arcs -->
  <g transform="translate(10, 8)">
    <!-- Golden Star (Tilted) -->
    <!-- Star points: top, right, bottom-right, bottom-left, left -->
    <path
      d="M 72 2 
         L 87 48 
         L 136 48 
         L 97 76 
         L 112 122 
         L 72 94 
         L 32 122 
         L 47 76 
         L 8 48 
         L 57 48 Z"
      fill="url(#starGrad)"
      transform="rotate(6, 72, 62)"
    />

    <!-- Upper/Outer Midnight Blue Arc -->
    <path
      d="M 235 44
         C 155 42, 70 85, 36 142
         C 28 156, 26 172, 27 186
         C 32 186, 38 174, 46 156
         C 75 106, 150 68, 235 44 Z"
      fill="#203056"
    />

    <!-- Inner Golden / Amber Dynamic Arc -->
    <path
      d="M 205 66
         C 142 66, 82 102, 54 148
         C 48 158, 44 172, 44 178
         C 48 178, 54 168, 62 152
         C 86 114, 140 84, 205 66 Z"
      fill="url(#goldArcGrad)"
    />
  </g>

  <!-- Wordmark: DEEKSHITH INFRA SOLUTIONS INDIA PRIVATE LIMITED -->
  <g fill="#111827">
    <!-- Top line -->
    <text
      x="152"
      y="114"
      font-family="'Space Grotesk', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-size="27"
      letter-spacing="-0.025em"
      fill="#111827"
    >
      DEEKSHITH INFRA SOLUTIONS
    </text>

    <!-- Bottom line -->
    <text
      x="152"
      y="152"
      font-family="'Space Grotesk', 'Arial Black', Impact, sans-serif"
      font-weight="900"
      font-size="24.5"
      letter-spacing="-0.015em"
      fill="#111827"
    >
      INDIA PRIVATE LIMITED
    </text>
  </g>
</svg>
