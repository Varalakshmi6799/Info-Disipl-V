<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="favGoldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 2)">
    <!-- Tilted Golden Star -->
    <path
      d="M 64 2 
         L 77 43 
         L 121 43 
         L 86 68 
         L 100 109 
         L 64 84 
         L 28 109 
         L 42 68 
         L 7 43 
         L 51 43 Z"
      fill="url(#favStar)"
      transform="rotate(6, 64, 55)"
    />

    <!-- Sweeping Navy Blue Arc -->
    <path
      d="M 148 38
         C 95 36, 42 74, 18 124
         C 12 136, 10 150, 11 156
         C 15 156, 20 146, 26 132
         C 48 90, 100 58, 148 38 Z"
      fill="#203056"
    />

    <!-- Sweeping Golden Arc -->
    <path
      d="M 130 56
         C 88 56, 46 88, 28 128
         C 24 136, 21 146, 22 152
         C 25 152, 29 144, 34 132
         C 50 100, 90 74, 130 56 Z"
      fill="url(#favGoldArc)"
    />
  </g>
</svg>
